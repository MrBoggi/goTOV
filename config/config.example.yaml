# Default configuration for goTOV.
# This file is copied to config.yaml inside the Docker image.
# All values can be overridden by environment variables.
# For example, `opcua.endpoint` can be set by the env var `GOTOV_OPCUA_ENDPOINT`.

opcua:
  endpoint: "opc.tcp://<ip_or_hostname>:4840"
  username: ""
  password: ""

# Separate, read-only ADS verification path. It is disabled by default and does
# not replace OPC UA or expose any ADS write capability.
ads:
  enabled: false
  host: ""
  port: 48898
  target_net_id: ""
  target_port: 851
  local_net_id: ""
  local_port: 10500
  request_timeout: "8s"
  poll_interval: "5s"
  freshness_window: "30s"

logging:
  level: "info" # "debug" is also a good option

server:
  listen_addr: ":8085"

fermentation:
  enabled: true
  database_path: "data/fermentation.db" # Path inside the container

  hysteresis:
    cooling: 0.3
    heating: 0.3

  step_check_interval: "30s"
  stabilization_time: "10m"

brewfather:
  user_id: "" # Your Brewfather User ID
  api_key: "" # Your Brewfather API Key
