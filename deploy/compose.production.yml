services:
  gotov:
    image: ${GOTOV_IMAGE:?Set GOTOV_IMAGE to the image being deployed}
    container_name: gotov
    restart: unless-stopped
    ports:
      - "18085:8085"
    environment:
      GOTOV_OPCUA_ENDPOINT: ${GOTOV_OPCUA_ENDPOINT}
      GOTOV_OPCUA_USERNAME: ${GOTOV_OPCUA_USERNAME}
      GOTOV_OPCUA_PASSWORD: ${GOTOV_OPCUA_PASSWORD}
      GOTOV_ADS_ENABLED: ${GOTOV_ADS_ENABLED:-false}
      GOTOV_ADS_HOST: ${GOTOV_ADS_HOST:-}
      GOTOV_ADS_PORT: ${GOTOV_ADS_PORT:-48898}
      GOTOV_ADS_TARGET_NET_ID: ${GOTOV_ADS_TARGET_NET_ID:-}
      GOTOV_ADS_TARGET_PORT: ${GOTOV_ADS_TARGET_PORT:-851}
      GOTOV_ADS_LOCAL_NET_ID: ${GOTOV_ADS_LOCAL_NET_ID:-}
      GOTOV_ADS_LOCAL_PORT: ${GOTOV_ADS_LOCAL_PORT:-10500}
      GOTOV_ADS_REQUEST_TIMEOUT: ${GOTOV_ADS_REQUEST_TIMEOUT:-8s}
      GOTOV_ADS_POLL_INTERVAL: ${GOTOV_ADS_POLL_INTERVAL:-5s}
      GOTOV_BREWFATHER_API_KEY: ${GOTOV_BREWFATHER_API_KEY}
      GOTOV_BREWFATHER_USER_ID: ${GOTOV_BREWFATHER_USER_ID}
      GOTOV_LOGGING_LEVEL: ${GOTOV_LOGGING_LEVEL:-info}
      TZ: Europe/Oslo
    volumes:
      - gotov_data:/app/data
    networks:
      - gotaplist_net

volumes:
  gotov_data:
    external: true
    name: go-tov_gotov_data

networks:
  gotaplist_net:
    external: true
    name: go-tov_gotaplist_net
